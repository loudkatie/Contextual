<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for the soul seed -->
    <radialGradient id="soulGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F8F8FF;stop-opacity:0.95" />
      <stop offset="70%" style="stop-color:#E6E6FA;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:0.2" />
    </radialGradient>

    <!-- Outer glow -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#E8E8F0;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:0" />
    </radialGradient>

    <!-- Shimmer gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#E8E8F0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:0.2" />
    </linearGradient>

    <!-- Soft blur filter -->
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background subtle glow -->
  <circle cx="400" cy="400" r="350" fill="url(#glowGradient)" opacity="0.3" filter="url(#softBlur)" />

  <!-- Main soul seed body -->
  <circle cx="400" cy="400" r="180" fill="url(#soulGradient)" filter="url(#glow)" opacity="0.95" />

  <!-- Inner shimmer layer -->
  <circle cx="400" cy="400" r="160" fill="url(#shimmer)" opacity="0.4" />

  <!-- Delicate highlights (fairy wing membrane effect) -->
  <ellipse cx="350" cy="350" rx="80" ry="120" fill="#FFFFFF" opacity="0.15" transform="rotate(-25 350 350)" />
  <ellipse cx="450" cy="380" rx="60" ry="100" fill="#FFFFFF" opacity="0.12" transform="rotate(15 450 380)" />

  <!-- Subtle iridescent edges -->
  <circle cx="400" cy="400" r="178" fill="none" stroke="#E6E6FA" stroke-width="2" opacity="0.3" />
  <circle cx="400" cy="400" r="175" fill="none" stroke="#E0F4FF" stroke-width="1" opacity="0.25" />
</svg>
